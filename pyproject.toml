[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isdi-scanner"
version = "1.0.11"
description = "ISDi - Stalkerware Scanner"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-only"
authors = [
    {name = "ISDI Contributors"}
]
keywords = ["privacy", "security", "stalkerware", "phone-scanner"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.0",
    "flask-wtf>=1.2",
    # Same range as PhoneView, so both share one install (`isdi-scanner[phoneview]`).
    # Pinned to a tested minor: pymobiledevice3's APIs change between releases.
    "pymobiledevice3>=11.49,<11.50",
    "click>=8.0",
    "pyyaml>=6.0",
    "rsonlite>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
]
termux = [
    "pymobiledevice3>=11.49,<11.50",
]
# Live screen view and control (PhoneView needs Python 3.11+).
phoneview = [
    "phoneview>=1.2,<2; python_version >= '3.11'",
]

[project.scripts]
isdi = "isdi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
# Ship only the files listed below. Globs over data/ or web/static/ once
# picked up local keys and a phone screenshot; scripts/check_dist.py checks
# the built wheel and sdist against this list.
include-package-data = false

[tool.setuptools.package-data]
isdi = [
    "data/app-flags.csv",
    "data/ios_device_identifiers.json",
    "data/ios_permissions.json",
    "data/android.test.apps_list",
    "web/schema.sql",
    "web/templates/_formhelpers.html",
    "web/templates/_phoneview_button.html",
    "web/templates/app.html",
    "web/templates/evidence.html",
    "web/templates/form.html",
    "web/templates/home.html",
    "web/templates/instruction.html",
    "web/templates/main.html",
    "web/templates/summary.html",
    "web/static/bootstrap.bundle.min.js",
    "web/static/bootstrap.min.css",
    "web/static/flUhRq6tzZclQEJ-Vdg-IuiaDsNc.woff2",
    "web/static/jquery-3.7.1.min.js",
    "web/static/myjscript.js",
    "web/static/style.css",
    "web/static/images/android.png",
    "web/static/images/android.resiz.png",
    "web/static/images/apple.png",
    "web/static/images/apple.resized.png",
    "web/static/images/usb_android.png",
    "web/static/images/usb_android.resized.png",
    "web/static/images/waiting.gif",
]
